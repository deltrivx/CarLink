name: Branch build check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358'

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug (host app + auto engine)
        run: ./gradlew :mobile:assembleDebug :auto:assembleDebug --stacktrace

      - name: Sign debug APK with the platform key
        env:
          PLATFORM_PK8_BASE64: ${{ secrets.PLATFORM_PK8_BASE64 }}
          PLATFORM_PEM_BASE64: ${{ secrets.PLATFORM_PEM_BASE64 }}
        run: |
          # 与 build-release 的正式包同一把飞思平台密钥：测试包与发布包签名统一，
          # 测试设备可以直接被 Release 覆盖升级，不必卸载重装。
          mkdir -p secrets
          echo "$PLATFORM_PK8_BASE64" | base64 -d > secrets/platform.pk8
          echo "$PLATFORM_PEM_BASE64" | base64 -d > secrets/platform.x509.pem
          apksigner sign \
            --key secrets/platform.pk8 \
            --cert secrets/platform.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 21 \
            --out dist/CarLink-debug.apk \
            mobile/build/outputs/apk/debug/mobile-debug.apk
          apksigner verify --verbose dist/CarLink-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLink-debug
          path: dist/CarLink-debug.apk
