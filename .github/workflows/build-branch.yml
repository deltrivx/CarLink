name: Branch build check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358'

      - uses: gradle/actions/setup-gradle@v6

      - name: Add Android Build Tools to PATH
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Prepare Signing Keys and MFi Assets
        env:
          PLATFORM_PK8_BASE64: ${{ secrets.PLATFORM_PK8_BASE64 }}
          PLATFORM_PEM_BASE64: ${{ secrets.PLATFORM_PEM_BASE64 }}
          AUTH_ASSETS_BASE64: ${{ secrets.DEPLAY_AUTH_ASSETS_BASE64 }}
        run: |
          mkdir -p secrets auth-assets/offline-mfi
          echo "$PLATFORM_PK8_BASE64" | base64 -d > secrets/platform.pk8
          echo "$PLATFORM_PEM_BASE64" | base64 -d > secrets/platform.x509.pem
          if [ -n "$AUTH_ASSETS_BASE64" ]; then
            echo "$AUTH_ASSETS_BASE64" | base64 -d | tar -xz -C auth-assets 2>/dev/null || true
            if [ -f auth-assets/identity.pk8 ] && [ ! -f auth-assets/offline-mfi/identity.pk8 ]; then
              cp auth-assets/identity.pk8 auth-assets/certificate.p7b auth-assets/offline-mfi/ 2>/dev/null || true
            fi
          fi
          echo "Listing auth-assets/offline-mfi:"
          ls -la auth-assets/offline-mfi/
          chmod +x gradlew

      - name: Assemble debug (host app + auto engine)
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ github.workspace }}/auth-assets
        run: ./gradlew :mobile:assembleDebug :auto:assembleDebug --stacktrace

      - name: Sign debug APK with the platform key
        run: |
          mkdir -p dist
          apksigner sign \
            --key secrets/platform.pk8 \
            --cert secrets/platform.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 21 \
            --out dist/CarLink-debug.apk \
            mobile/build/outputs/apk/debug/mobile-debug.apk
          apksigner verify --verbose dist/CarLink-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLink-debug
          path: dist/CarLink-debug.apk
