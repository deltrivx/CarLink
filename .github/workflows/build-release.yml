name: Build and Release (CarLink & EasyConnect)

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 2026.10.21.01)'
        required: false
      version_code:
        description: 'Version Code (e.g. 2026102101)'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358'

      - uses: gradle/actions/setup-gradle@v6

      - name: Add Android Build Tools to PATH
        run: |
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Prepare Signing Keys and MFi Assets
        env:
          PLATFORM_PK8_BASE64: ${{ secrets.PLATFORM_PK8_BASE64 }}
          PLATFORM_PEM_BASE64: ${{ secrets.PLATFORM_PEM_BASE64 }}
          AUTH_ASSETS_BASE64: ${{ secrets.DEPLAY_AUTH_ASSETS_BASE64 }}
        run: |
          mkdir -p secrets auth-assets/offline-mfi
          echo "$PLATFORM_PK8_BASE64" | base64 -d > secrets/platform.pk8
          echo "$PLATFORM_PEM_BASE64" | base64 -d > secrets/platform.x509.pem
          if [ -n "$AUTH_ASSETS_BASE64" ]; then
            echo "$AUTH_ASSETS_BASE64" | base64 -d | tar -xz -C auth-assets 2>/dev/null || true
            if [ -f auth-assets/identity.pk8 ] && [ ! -f auth-assets/offline-mfi/identity.pk8 ]; then
              cp auth-assets/identity.pk8 auth-assets/certificate.p7b auth-assets/offline-mfi/ 2>/dev/null || true
            fi
          fi
          echo "Listing auth-assets/offline-mfi:"
          ls -la auth-assets/offline-mfi/
          chmod +x gradlew

      - name: Determine Version
        id: ver
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-}"
          INPUT_VNAME="${{ github.event.inputs.version_name }}"
          INPUT_VCODE="${{ github.event.inputs.version_code }}"
          if [ -n "$INPUT_VNAME" ]; then
            VNAME="$INPUT_VNAME"
            VCODE="${INPUT_VCODE:-$(echo "$VNAME" | tr -cd '0-9')}"
          elif [ -n "$TAG_NAME" ]; then
            VNAME="${TAG_NAME#v}"
            # 支持 YYYY.MM.DD.N 与 YYYY.MM.DD-N；末段统一补零到两位（2026.10.21.1 → 2026.10.21.01）
            if [[ "$VNAME" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+ ]]; then
              DATE_PART="$(echo "$VNAME" | cut -d'.' -f1-3 | tr -d '.')"
              SUFFIX="$(echo "$VNAME" | cut -d'.' -f4)"
            elif [[ "$VNAME" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+ ]]; then
              DATE_PART="$(echo "$VNAME" | cut -d'-' -f1 | tr -d '.')"
              SUFFIX="$(echo "$VNAME" | cut -d'-' -f2)"
            else
              DATE_PART="$(echo "$VNAME" | tr -d '.')"
              SUFFIX="1"
            fi
            [ -n "$SUFFIX" ] || SUFFIX="1"
            # 末段固定两位：1→01，12→12
            SUFFIX_PADDED="$(printf '%02d' "$((10#$SUFFIX))")"
            VNAME="${DATE_PART:0:4}.${DATE_PART:4:2}.${DATE_PART:6:2}.${SUFFIX_PADDED}"
            VCODE="${DATE_PART}${SUFFIX_PADDED}"
          else
            TODAY="$(date +%Y.%m.%d)"
            # 全新一天无 tag 时的兜底：当天第 01 版，末段同样两位
            VNAME="${TODAY}.01"
            VCODE="${TODAY//./}01"
          fi
          echo "VNAME=$VNAME" >> "$GITHUB_OUTPUT"
          echo "VCODE=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Building version: $VNAME ($VCODE)"

      - name: Update README with New Version & Badge
        run: |
          sed -i -E 's/构建-FnOS%20本地-1E6FA8/构建-GitHub%20Actions-2088FF/g' README.md
          sed -i -E 's/全部构建在 FnOS 本机完成，不依赖 GitHub Actions/由 GitHub Actions 全自动构建并飞思平台签名开源发版/g' README.md
          # 更新 README 中的最新版本示例
          sed -i -E "s/CarLink-[0-9]{4}\.[0-9]{2}\.[0-9]{2}[-.0-9]*\.apk/CarLink.apk/g" README.md
          sed -i -E "s/EasyConnect-[0-9]{4}\.[0-9]{2}\.[0-9]{2}[-.0-9]*\.apk/EasyConnect.apk/g" README.md

      - name: Build Generic (CarLink.apk - without system UID)
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ github.workspace }}/auth-assets
        run: |
          ./gradlew :mobile:assembleRelease --no-daemon --stacktrace \
            "-PversionName=${{ steps.ver.outputs.VNAME }}" \
            "-PversionCode=${{ steps.ver.outputs.VCODE }}" \
            "-PupdateRepoOwner=deltrivx" \
            "-PupdateRepoName=CarLink" \
            -PsystemUid=false

      - name: Sign Generic APK
        run: |
          mkdir -p dist
          UNSIGNED="mobile/build/outputs/apk/release/mobile-release-unsigned.apk"
          [ -f "$UNSIGNED" ] || UNSIGNED="mobile/build/outputs/apk/release/mobile-release.apk"
          apksigner sign \
            --key secrets/platform.pk8 \
            --cert secrets/platform.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 21 \
            --out "dist/CarLink.apk" \
            "$UNSIGNED"

      - name: Clean build cache before custom build
        run: ./gradlew clean --no-daemon

      - name: Build Custom (EasyConnect.apk - with system UID)
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ github.workspace }}/auth-assets
        run: |
          ./gradlew :mobile:assembleRelease --no-daemon --stacktrace \
            "-PversionName=${{ steps.ver.outputs.VNAME }}" \
            "-PversionCode=${{ steps.ver.outputs.VCODE }}" \
            "-PupdateRepoOwner=deltrivx" \
            "-PupdateRepoName=CarLink" \
            -PsystemUid=true

      - name: Sign Custom APK
        run: |
          UNSIGNED="mobile/build/outputs/apk/release/mobile-release-unsigned.apk"
          [ -f "$UNSIGNED" ] || UNSIGNED="mobile/build/outputs/apk/release/mobile-release.apk"
          apksigner sign \
            --key secrets/platform.pk8 \
            --cert secrets/platform.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 21 \
            --out "dist/EasyConnect.apk" \
            "$UNSIGNED"

      - name: Verification and Checksums
        run: |
          cd dist
          apksigner verify --verbose "CarLink.apk"
          apksigner verify --verbose "EasyConnect.apk"
          sha256sum CarLink.apk EasyConnect.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # 2026.10.31.06 起通用版资产直接命名 CarLink.apk（OTA 代码已同步适配），
          # 不再生成 -generic 变体；SHA256SUMS.txt 同时覆盖两个 APK。

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: "${{ steps.ver.outputs.VNAME }}"
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "CarLink & EasyConnect $TAG release. Both signed with Freescale platform key. CarLink is generic; EasyConnect includes sharedUserId=android.uid.system."
          gh release upload "$TAG" dist/CarLink.apk dist/EasyConnect.apk dist/SHA256SUMS.txt --clobber
