name: Release build (generic)

# This repository is the generic build's home: no system uid, upstream accessory
# identity, for any Android device. Its releases feed the generic install's update
# check. The custom build for the car is published from the private repository,
# and the custom install looks there instead.
#
# Both lines are signed with the same release key, so an install of one can be
# upgraded to the other: a driver who starts on the generic build can move to the
# car's custom build without uninstalling. The key arrives as a repository secret
# and is written to a file only for the build, never committed.
#
# The generic build declares no system uid. A public build that declares one it
# was never granted is a build Android refuses to update, and an install carrying
# it can never be upgraded over.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The same key the car build is signed with, so a generic install can be
      # upgraded to the custom one. Absent in a fork, which then falls back to
      # the debug key and still builds.
      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No RELEASE_KEYSTORE_B64 secret; the build will use the debug key."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keys/release.jks" >>"$GITHUB_ENV"

      - name: Build the generic release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew mobile:assembleRelease --stacktrace
          -PsystemUid=false
          -PupdateRepoName=CarLink

      - name: Stage the APK and its checksums
        id: version
        run: |
          set -e
          VER="$(grep -m1 'versionName' mobile/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Building generic $VER"
          mkdir -p dist
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/CarLink-$VER-generic.apk"
          cd dist
          sha256sum "CarLink-$VER-generic.apk" > SHA256SUMS-generic.txt
          cp SHA256SUMS-generic.txt SHA256SUMS.txt
          echo "ver=$VER" >>"$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.version.outputs.ver }}
        run: |
          set -e
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" \
            --title "CarLink $VER" \
            --notes "CarLink $VER — generic build, for any Android device. No system uid; upstream accessory identity. Licence GPL-3.0. Source: this repository at tag v$VER. A derivative work of DiPlay / XcertPlay. **Not Apple-certified.**"
          gh release upload "v$VER" dist/*.apk dist/*.txt --clobber
