name: Release build (generic)

# This repository is the generic build's home: no system uid, upstream
# accessory identity, for any Android device. Its releases feed the generic
# install's update check. The custom build for the car is published from the
# private repository, and the custom install looks there instead.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build the generic release
        run: ./gradlew mobile:assembleRelease --stacktrace

      - name: Stage the APK and its checksums
        id: version
        run: |
          set -e
          VER="$(grep -m1 'versionName' mobile/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Building generic $VER"
          mkdir -p dist
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/CarLink-$VER-generic.apk"
          cd dist
          sha256sum "CarLink-$VER-generic.apk" > SHA256SUMS-generic.txt
          cp SHA256SUMS-generic.txt SHA256SUMS.txt
          echo "ver=$VER" >>"$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.version.outputs.ver }}
        run: |
          set -e
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" \
            --title "CarLink $VER" \
            --notes "CarLink $VER — generic build, for any Android device. No system uid; upstream accessory identity. Licence GPL-3.0. Source: this repository at tag v$VER. A derivative work of DiPlay / XcertPlay. **Not Apple-certified.**"
          gh release upload "v$VER" dist/*.apk dist/*.txt --clobber
